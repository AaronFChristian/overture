name: Deploy to Azure Container Apps

# Manual trigger only, not on every push -- see decisions.md D-0033.
# This project's Azure landing zone is destroyed at the end of every
# session (D-0025 onward); an auto-deploy-on-push workflow would fail
# loudly (or worse, silently do nothing useful) on any push made while
# the infrastructure doesn't currently exist. A manual button matches
# the same "you decide when this touches real infrastructure" pattern
# already used for `terraform apply`/`destroy` throughout this project.
on:
  workflow_dispatch:

permissions:
  id-token: write   # required for Azure OIDC login -- no client secret anywhere
  contents: read
  packages: write    # required to push to GitHub Container Registry

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "ghcr.io/${{ github.repository }}:${{ github.sha }}"
