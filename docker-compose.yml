services:
  db:
    image: pgvector/pgvector:pg16
    container_name: overture-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: overture
      POSTGRES_PASSWORD: overture
      POSTGRES_DB: overture
    ports:
      - "5432:5432"
    volumes:
      - overture_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overture -d overture"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  overture_pgdata:
